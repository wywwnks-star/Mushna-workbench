<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="创作工作台">
  <meta name="description" content="自媒体创作者专属工作台 - 数据看板、热点追踪、灵感收集、日记记录">
  <title>创作工作台</title>
  <script>
    var APP_VERSION = 'v10';

    // ========== 紧急修复：彻底清理无限刷新循环 ==========
    (function() {
      var CLEANUP_FLAG = 'sw_cleanup_v10_done';
      
      // 如果还没做过清理，先彻底注销所有Service Worker并清理缓存
      if (sessionStorage.getItem(CLEANUP_FLAG) !== '1') {
        sessionStorage.setItem(CLEANUP_FLAG, '1');
        
        var needsReload = false;
        
        try {
          // 注销所有Service Worker
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              if (registrations && registrations.length > 0) {
                needsReload = true;
                return Promise.all(registrations.map(function(r) {
                  console.log('注销旧SW:', r.scope);
                  return r.unregister();
                }));
              }
            }).then(function() {
              // 清理所有缓存
              if ('caches' in window) {
                return caches.keys().then(function(keys) {
                  if (keys && keys.length > 0) {
                    needsReload = true;
                    return Promise.all(keys.map(function(k) {
                      console.log('删除缓存:', k);
                      return caches.delete(k);
                    }));
                  }
                });
              }
            }).then(function() {
              // 只有在确实有东西需要清理时才刷新
              if (needsReload) {
                console.log('清理完成，刷新页面...');
                // 添加时间戳确保获取最新内容，用replace避免历史记录问题
                var sep = window.location.search ? '&' : '?';
                window.location.replace(window.location.pathname + window.location.search + sep + '_swclean=' + Date.now());
              }
            }).catch(function(err) {
              console.warn('SW清理过程出错，但已设置安全标志:', err);
              // 即使清理出错，页面也会正常加载（新代码不会自动刷新）
            });
          }
        } catch(e) {
          console.warn('清理脚本异常，继续加载:', e);
        }
      }
    })();

    // 错误处理
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;font-family:system-ui,sans-serif;"><h2 style="color:#ef4444;">⚠️ 加载出错</h2><p style="color:#666;margin:16px 0;">' + (e.message || '未知错误') + '</p><p style="color:#999;font-size:14px;">请按 Ctrl+Shift+R (Windows) 或 Cmd+Shift+R (Mac) 强制刷新页面</p><button onclick="location.reload(true)" style="background:#10b981;color:white;border:none;padding:12px 32px;border-radius:8px;font-size:16px;margin-top:16px;cursor:pointer;">🔄 重新加载</button></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Promise错误:', e.reason);
    });

    // 设置BASE_PATH
    (function() {
      var path = window.location.pathname;
      var basePath = '/';
      if (path.endsWith('.html')) {
        basePath = path.substring(0, path.lastIndexOf('/') + 1);
      } else if (path.endsWith('/')) {
        basePath = path;
      } else {
        basePath = path.substring(0, path.lastIndexOf('/') + 1);
      }
      window.BASE_PATH = basePath;
      var baseTag = document.createElement('base');
      baseTag.href = basePath;
      document.head.appendChild(baseTag);
    })();

    // 版本更新时清理旧缓存
    (function() {
      var lastVersion = localStorage.getItem('app_version');
      if (lastVersion !== APP_VERSION) {
        console.log('版本更新:', lastVersion, '->', APP_VERSION);
        localStorage.setItem('app_version', APP_VERSION);
      }
    })();
  </script>

</head>

    manifestLink.rel = 'manifest';
    manifestLink.href = 'manifest.json?v=10';
